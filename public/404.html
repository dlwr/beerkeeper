<!doctype html>
<html lang="ja">
  <head>
    <title>ページが見つかりません｜Beerkeeper</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fff;
        color: #1f2328;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
        font-size: 16px;
        line-height: 1.7;
      }
      main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
      h1 { margin: 0 0 1rem; font-size: 1.75rem; line-height: 1.35; }
      p { margin: 0 0 1.5rem; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: .375rem;
        background: #f9c023;
        color: #1f2328;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #e5ac0b; }
      a:focus-visible { outline: 3px solid #1f2328; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>ページが見つかりません</h1>
      <p>URL が間違っているか、イベントが削除された可能性があります。</p>
      <a href="/">イベント一覧へ</a>
    </main>
  </body>
</html>
