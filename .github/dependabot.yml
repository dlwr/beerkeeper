version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  versioning-strategy: lockfile-only
  schedule:
    interval: weekly
    day: wednesday
    time: "09:00"
    timezone: "Asia/Tokyo"
  open-pull-requests-limit: 10
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    day: wednesday
    time: "09:00"
    timezone: "Asia/Tokyo"
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    day: wednesday
    time: "09:00"
    timezone: "Asia/Tokyo"
